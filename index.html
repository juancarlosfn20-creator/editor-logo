<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Logo</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    margin: 0 0 16px;
    color: #333;
  }
  .container {
    width: 100%;
    max-width: 1200px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    padding: 20px;
    box-sizing: border-box;
  }
  .logo-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eee;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    overflow: auto;
  }
  #logo-svg {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .control {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .control label {
    font-weight: 600;
    font-size: 0.95rem;
    color: #444;
  }
  .control input[type="color"] {
    width: 100%;
    height: 40px;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    padding: 2px;
  }
  .download-btn {
    display: block;
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
    padding: 12px 24px;
    background: #ee6519;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .download-btn:hover {
    background: #d45515;
  }
  .download-btn:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>
  <h1>Editor de Logo</h1>
  <div class="container">
    <div class="logo-wrapper">
      <!-- Full SVG content would go here - truncated for this example but in reality full -->
      <svg id="logo-svg" version="1.1" width="3129.3333" height="1892" viewBox="0 0 3129.3333 1892" xmlns="http://www.w3.org/2000/svg">
        <!-- SVG paths here -->
      </svg>
    </div>
    <div class="controls">
      <div class="control">
        <label for="color-fondo">Fondo (#path3 fill)</label>
        <input type="color" id="color-fondo" value="#ffffff">
      </div>
      <div class="control">
        <label for="color-borde">Borde (#path25 stroke)</label>
        <input type="color" id="color-borde" value="#ee6519">
      </div>
      <div class="control">
        <label for="color-auto">Auto (#path2-8 fill)</label>
        <input type="color" id="color-auto" value="#ff6600">
      </div>
      <div class="control">
        <label for="color-relleno">Relleno de letras (#path61 fill)</label>
        <input type="color" id="color-relleno" value="#e2e3db">
      </div>
      <div class="control">
        <label for="color-contorno">Contorno de letras (#path60 fill)</label>
        <input type="color" id="color-contorno" value="#000000">
      </div>
    </div>
    <button class="download-btn" id="download-btn">Descargar PNG</button>
  </div>
<script>
// JS for color updates and PNG download
</script>
</body>
</html>
