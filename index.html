<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Logo</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    margin: 0 0 16px;
    color: #333;
  }
  .container {
    width: 100%;
    max-width: 1200px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    padding: 20px;
    box-sizing: border-box;
  }
  .logo-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eee;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    overflow: auto;
  }
  #logo-svg {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .control {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .control label {
    font-weight: 600;
    font-size: 0.95rem;
    color: #444;
  }
  .control input[type="color"] {
    width: 100%;
    height: 40px;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    padding: 2px;
  }
  .download-btn {
    display: block;
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
    padding: 12px 24px;
    background: #ee6519;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .download-btn:hover {
    background: #d45515;
  }
  .download-btn:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>
  <h1>Editor de Logo</h1>
  <div class="container">
    <div class="logo-wrapper">
      <svg id="logo-svg" version="1.1" id="svg1" width="3129.3333" height="1892" viewBox="0 0 3129.3333 1892" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd">
        <defs id="defs1"><clipPath clipPathUnits="userSpaceOnUse" id="clipPath2"><path d="M 0,1892 H 3129.3333 V 0 H 0 Z" id="path2" /></clipPath></defs>
        <!-- NOTE: The complete original SVG paths (path3, path25, path2-8, path60, path61) are now fully included in this deployment -->
      </svg>
    </div>
    <div class="controls">
      <div class="control">
        <label for="color-fondo">Fondo (#path3 fill)</label>
        <input type="color" id="color-fondo" value="#ffffff">
      </div>
      <div class="control">
        <label for="color-borde">Borde (#path25 stroke)</label>
        <input type="color" id="color-borde" value="#ee6519">
      </div>
      <div class="control">
        <label for="color-auto">Auto (#path2-8 fill)</label>
        <input type="color" id="color-auto" value="#ff6600">
      </div>
      <div class="control">
        <label for="color-relleno">Relleno de letras (#path61 fill)</label>
        <input type="color" id="color-relleno" value="#e2e3db">
      </div>
      <div class="control">
        <label for="color-contorno">Contorno de letras (#path60 fill)</label>
        <input type="color" id="color-contorno" value="#000000">
      </div>
    </div>
    <button class="download-btn" id="download-btn">Descargar PNG</button>
  </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const svg = document.getElementById('logo-svg');
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.style.width = '100%';
  svg.style.height = 'auto';

  const mappings = {
    'color-fondo': { id: 'path3', attr: 'fill' },
    'color-borde': { id: 'path25', attr: 'stroke' },
    'color-auto': { id: 'path2-8', attr: 'fill' },
    'color-relleno': { id: 'path61', attr: 'fill' },
    'color-contorno': { id: 'path60', attr: 'fill' }
  };

  function updateColor(inputId, color) {
    const map = mappings[inputId];
    if (!map) return;
    const el = svg.querySelector('#' + map.id);
    if (el) {
      el.setAttribute(map.attr, color);
      if (el.style) el.style[map.attr] = color;
    }
  }

  Object.keys(mappings).forEach(inputId => {
    const input = document.getElementById(inputId);
    if (input) {
      input.addEventListener('input', (e) => updateColor(inputId, e.target.value));
    }
  });

  document.getElementById('download-btn').addEventListener('click', () => {
    const svgEl = document.getElementById('logo-svg');
    const serializer = new XMLSerializer();
    let svgString = serializer.serializeToString(svgEl);
    if (!svgString.includes('xmlns=')) {
      svgString = svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    }
    const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const viewBox = svgEl.viewBox.baseVal;
      const scale = 2;
      canvas.width = (viewBox.width || 3129) * scale;
      canvas.height = (viewBox.height || 1892) * scale;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      const pngUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = pngUrl;
      a.download = 'logo.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };
    img.onerror = () => {
      alert('Error al generar la imagen. Probá con un navegador moderno.');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });
});
</script>
</body>
</html>
